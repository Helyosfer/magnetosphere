<!doctype html>
<!-- Mağaza görsellerinin sahnesi. Adres: /magaza/sahne.html?shot=<görsel>&lang=<tr|en> -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/panel.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; min-height: 0; overflow: hidden; }
  body { position: relative; background: #0a0d14; font-family: "Inter", system-ui, sans-serif; color: #e6ebf2; }
  body::before { display: none; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(520px 360px at 0 0, rgba(92, 242, 165, .085), transparent 75%),
      radial-gradient(560px 380px at 100% 100%, rgba(66, 200, 255, .075), transparent 75%); }
  .copy { position: absolute; left: 110px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 44px; }
  .brand svg { width: 24px; height: 24px; }
  h1 { margin: 0; font-size: 50px; line-height: 1.1; font-weight: 700; letter-spacing: -1.3px; white-space: pre-line; }
  .sub { margin: 18px 0 0; font-size: 22px; line-height: 1.48; color: #97a2b4; white-space: pre-line; }
  .frame { position: absolute; left: 768px; top: 49px; width: 400px; height: 700px; border: 1px solid #263042;
    border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); background: #0b0e14; }
  .frame iframe { display: block; width: 400px; height: 700px; border: 0; }

  /* Sağ tık sahnesi: Kick sohbetine benzeyen örnek */
  .chat { position: absolute; left: 830px; top: 49px; width: 340px; height: 700px; border: 1px solid #263042;
    border-radius: 18px; background: #0f131b; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
    display: flex; flex-direction: column; font-size: 15px; }
  .chat header { display: flex; align-items: center; gap: 11px; height: 59px; padding: 0 18px; border-bottom: 1px solid #1f2735; }
  .chat header .pic { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #42c8ff, #7b8cff); }
  .chat header strong { flex: 1; font-size: 16px; font-weight: 600; }
  .chat header .live { color: #ff5d6c; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .chat header .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .lines { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 8px 4px; }
  .lines p { margin: 0; padding: 6px 10px; line-height: 1.4; color: #dfe5ee; }
  .lines b { font-weight: 700; margin-right: 6px; }
  .lines p.hit { border: 1px solid #2c6b55; background: #12241f; border-radius: 10px; margin: 3px 0; }
  .lines p.hit span { color: #c9d1dc; }
  .chat footer { border-top: 1px solid #1f2735; padding: 14px 18px 14px; }
  .chat footer div { height: 42px; border: 1px solid #263042; border-radius: 10px; background: #151a24;
    color: #6c788a; font-size: 14px; display: flex; align-items: center; padding: 0 12px; }
  .ucard { position: absolute; left: 540px; top: 210px; width: 268px; height: 198px; border: 1px solid #263042;
    border-radius: 14px; overflow: hidden; background: #171c27; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
  .ucard .cover { height: 64px; background: linear-gradient(180deg, #2b3550, #222a3d); }
  .ucard .x { position: absolute; right: 11px; top: 11px; width: 26px; height: 26px; border-radius: 7px; background: #1a2130;
    display: grid; place-items: center; font-size: 15px; color: #dfe5ee; }
  .ucard .face { width: 60px; height: 60px; border-radius: 50%; margin: -28px auto 0; border: 3px solid #121722;
    background: radial-gradient(circle at 40% 35%, #a3adbd, #6b7486); }
  .ucard .nick { display: inline-block; margin-top: 10px; font-size: 19px; font-weight: 700; text-decoration: underline;
    text-underline-offset: 4px; text-decoration-thickness: 1px; position: relative; }
  .ucard .cursor { position: absolute; left: 164px; top: 126px; width: 15px; }
  .stats { display: flex; justify-content: center; gap: 28px; margin-top: 8px; font-size: 13px; }
  .stats div { display: flex; flex-direction: column; }
  .stats b { font-weight: 700; color: #e6ebf2; }
  .stats span { color: #8491a5; }
  .menu { position: absolute; left: 540px; top: 423px; width: 268px; border: 1px solid #2b3445; border-radius: 10px;
    background: #1b2130; padding: 8px 6px; font-size: 14px; color: #dfe5ee; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
  .menu div { padding: 7px 38px; line-height: 1.3; }
  .menu hr { border: 0; border-top: 1px solid #2d3647; margin: 6px 4px; }
  .menu .pick { position: relative; margin: 0; border: 1px solid #2f8064; border-radius: 7px; font-weight: 600; color: #fff;
    background: linear-gradient(90deg, #1b4239, #1c3446); padding: 8px 37px; }
  .menu .pick svg { position: absolute; left: 13px; top: 9px; width: 16px; height: 16px; }

  /* Tanıtım kutuları */
  .promo { position: absolute; inset: 0; background: linear-gradient(135deg, #15282a 0%, #0d121a 55%, #11202c 100%); }
  .small { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .small svg { width: 52px; height: 52px; }
  .small h1 { font-size: 36px; letter-spacing: -.8px; margin-top: 14px; }
  .small p { margin: 10px 0 0; font-size: 15px; color: #9aa6b8; }
  .promo.big { background: none; }
  .big .copy { left: 110px; }
  .big .copy svg { width: 72px; height: 72px; margin-bottom: 30px; }
  .big h1 { font-size: 82px; letter-spacing: -3px; line-height: 1; }
  .big .sub { font-size: 32px; margin-top: 26px; }
  .big .frame { left: 870px; top: 60px; height: 540px; }
  .big .frame iframe { height: 540px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf2a5"/><stop offset="1" stop-color="#42c8ff"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 24 24" fill="none" stroke="url(#aurora)" stroke-width="1.7" stroke-linecap="round">
      <circle cx="8" cy="12" r="3" fill="url(#aurora)" stroke="none"/>
      <path d="M8 4.5c6.4 0 11 3.2 11 7.500s-4.600 7.500-11 7.500"/>
      <path d="M8 8c3.700 0 6.300 1.700 6.300 4s-2.600 4-6.300 4" opacity=".55"/>
    </symbol>
  </defs>
</svg>
<div class="bg"></div>
<div id="stage"></div>
<script>
const params = new URLSearchParams(location.search);
const SHOT = params.get("shot");
const LANG = params.get("lang") === "tr" ? "tr" : "en";

const TEXT = {
  tr: {
    banla: ["Bir kez banla,\nher kanalda geçerli olsun", "Kullanıcı adını yaz, süreyi seç. Ban, listendeki\nbütün kanallara tek seferde uygulanır."],
    liste: ["Kim, kimi, neden banladı?\nHepsi tek listede", "Aktif banları ve her kanaldaki sonucu tek\nekrandan izle. Uygulanamayanı yeniden dene,\nistediğini tek tıkla kaldır."],
    sira: ["Uzun listeler\nartık dert değil", "Kullanıcı adlarını yapıştır ya da dosyadan yükle.\nGerisini Magnetosphere arka planda halleder;\npaneli kapatsan bile işlem sürer."],
    ekip: ["İster tek başına yönet,\nister ekibinle", "Kanallarını ekle, davet koduyla modlarını çağır.\nHerkes aynı listeyi görür; rolleri sen dağıtırsın."],
    sagtik: ["Sağ tıkla,\nher kanalda banla", "Sohbette kullanıcının kartını aç,\nadına sağ tıkla. Panel o adla açılır;\ntek düğmeyle listendeki bütün\nkanallarda banlarsın."],
    tagline: "Kick mod ekipleri için ortak ban listesi",
    channel: "ornek_kanal", live: "Canlı", send: "Mesaj gönder",
    account: "Hesap", accountAge: "2 gün önce", messages: "Mesaj",
    menu: ["Bağlantıyı yeni sekmede aç", "Bağlantı adresini kopyala", "Ekibin tüm kanallarında banla", "İncele"],
    chat: [
      ["kahve_sever", "geldim geldim"], ["gece_kusu", "bugün ne oynuyoruz?"], ["mavi_kedi", "dünkü yayın çok iyiydi"],
      ["yildiz_tozu", "yayın başladı mı?"], ["pixel_ustasi", "herkese iyi akşamlar"], ["mavi_kedi", "bu bölüm efsaneydi"],
      ["gece_kusu", "selam herkese 👋"], ["pixel_ustasi", "bir sonraki oyun ne olacak?"], ["kahve_sever", "ses biraz kısık geliyor"],
      ["spam_bot_4821", "ÜCRETSİZ TAKİPÇİ!!!\nhemen tıkla → takipci-bedava.example", true],
      ["yildiz_tozu", "yine mi bot 😑"], ["gece_kusu", "modlar nerede"], ["pixel_ustasi", "gg wp"],
      ["kahve_sever", "şimdi daha iyi oldu"], ["mavi_kedi", "harika yayın"],
    ],
  },
  en: {
    banla: ["Ban once,\nand it sticks everywhere", "Type the username, pick a duration. The ban is\napplied to every channel on your list at once."],
    liste: ["Who banned whom?\nIt's all in one list", "See every active ban, who placed it and why,\nand how it went on each channel. Retry what didn't go\nthrough, remove any ban with one click."],
    sira: ["Long lists?\nNo problem", "Paste usernames or load them from a file.\nMagnetosphere handles the rest in the background,\neven if you close the panel."],
    ekip: ["Go solo,\nor bring your team", "Add your channels and invite your mods with a code.\nEveryone sees the same list; you hand out the roles."],
    sagtik: ["Right-click,\nban everywhere", "Open the user's card in chat and\nright-click their name. The panel opens\nwith that name; one button bans them\non every channel on your list."],
    tagline: "A shared ban list for Kick mod teams",
    channel: "example_channel", live: "Live", send: "Send a message",
    account: "Account", accountAge: "2 days ago", messages: "Messages",
    menu: ["Open link in new tab", "Copy link address", "Ban on all team channels", "Inspect"],
    chat: [
      ["coffee_lover", "here, here!"], ["night_owl", "what are we playing today?"], ["blue_cat", "yesterday's stream was great"],
      ["stardust", "has the stream started?"], ["pixel_master", "good evening everyone"], ["blue_cat", "this episode was legendary"],
      ["night_owl", "hi everyone 👋"], ["pixel_master", "what's the next game?"], ["coffee_lover", "audio is a bit quiet"],
      ["spam_bot_4821", "FREE FOLLOWERS!!!\nclick now → free-followers.example", true],
      ["stardust", "another bot? 😑"], ["night_owl", "where are the mods"], ["pixel_master", "gg wp"],
      ["coffee_lover", "much better now"], ["blue_cat", "great stream"],
    ],
  },
}[LANG];

const SCENE = { banla: "ban", liste: "list", sira: "queue", ekip: "crew" };
const COLORS = ["#6fd7b6", "#f0a37a", "#8fb1ff", "#f3cf6b", "#c39bff"];
const stage = document.getElementById("stage");
const logo = '<svg><use href="#logo"/></svg>';
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const panel = (scene) => `<div class="frame"><iframe src="/panel.html?scene=${scene}&lang=${LANG}"></iframe></div>`;
const copy = ([title, sub]) =>
  `<div class="copy"><div class="brand">${logo}Magnetosphere</div><h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p></div>`;

if (SCENE[SHOT]) {
  stage.innerHTML = copy(TEXT[SHOT]) + panel(SCENE[SHOT]);
} else if (SHOT === "sagtik") {
  const names = [...new Set(TEXT.chat.map(([n]) => n))];
  const color = (n) => (n.startsWith("spam_") ? "#8fb1ff" : COLORS[names.indexOf(n) % COLORS.length]);
  const lines = TEXT.chat.map(([n, msg, hit]) => hit
    ? `<p class="hit"><b style="color:${color(n)}">${n}</b><span>${esc(msg).replace("\n", "<br>")}</span></p>`
    : `<p><b style="color:${color(n)}">${n}</b>${esc(msg)}</p>`).join("");
  stage.innerHTML = copy(TEXT.sagtik) + `
    <div class="chat">
      <header><span class="pic"></span><strong>${TEXT.channel}</strong><span class="live">${TEXT.live}</span></header>
      <div class="lines">${lines}</div>
      <footer><div>${TEXT.send}</div></footer>
    </div>
    <div class="ucard">
      <div class="cover"></div><div class="x">✕</div><div class="face"></div>
      <div class="nick">spam_bot_4821</div>
      <svg class="cursor" viewBox="0 0 12 18"><path d="M1 1v14l3.6-3.4 2.6 5.6 2.2-1-2.6-5.4H12z" fill="#fff" stroke="#111" stroke-width="1"/></svg>
      <div class="stats"><div><b>${TEXT.account}</b><span>${TEXT.accountAge}</span></div><div><b>${TEXT.messages}</b><span>14</span></div></div>
    </div>
    <div class="menu">
      <div>${TEXT.menu[0]}</div><div>${TEXT.menu[1]}</div><hr>
      <div class="pick">${logo}${TEXT.menu[2]}</div><hr>
      <div>${TEXT.menu[3]}</div>
    </div>`;
  // Sohbet satırları sığmazsa en eskiler görünmez kalsın (gerçek sohbet gibi alttan dolar).
  document.querySelector(".lines").style.overflow = "hidden";
} else if (SHOT === "kucuk") {
  stage.innerHTML = `<div class="promo"><div class="small">${logo}<h1>Magnetosphere</h1><p>${TEXT.tagline}</p></div></div>`;
} else if (SHOT === "buyuk") {
  stage.innerHTML = `<div class="promo big"><div class="copy">${logo}<h1>Magnetosphere</h1><p class="sub">${TEXT.tagline}</p></div>${panel("list")}</div>`;
}
</script>
</body>
</html>
